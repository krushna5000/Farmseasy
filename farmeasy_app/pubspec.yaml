name: farmeasy_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.0.15
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  intl: ^0.20.2   # Added for date formatting

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4  # For generating app launcher icon

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/final_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/final_logo.png
    - assets/illustrations/farmer_illustration.png
